<!doctype html>
<html dir="rtl" lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مودال خطا و هشدار</title>
<style>
  @font-face { font-family: IRANSans-FaNum; src: url(fonts/IRANSANSWEBFANUM.ttf); font-weight: 400; }
  @font-face { font-family: IRANSans-FaNum; src: url(fonts/IRANSANSWEBFANUM_MEDIUM.ttf); font-weight: 500 900; }
  body { margin: 0; padding: 24px 16px; background: #8a8f9a; font-family: IRANSans-FaNum, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px 24px; max-width: 760px; margin: 0 auto; }
  .opt h2 { margin: 0 0 10px; font-size: 14px; font-weight: 500; color: #fff; }
  /* error dialog on «تکمیل سفارش»: outlined card, «خطا» flag on the right wall (solid icon), message, #ededed divider, compact green action.
     Sized for any message: max 360px, wraps long words, scrolls past screen height. */
  .flagv .err-dlg { width: calc(100vw - 32px); max-width: 360px; max-height: calc(100dvh - 32px); box-sizing: border-box; padding: 0; overflow-y: auto; border: 1px solid #e3e6ea; border-radius: 14px; outline: 4px solid rgba(255, 255, 255, .2); background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 48, .05), 0 12px 32px rgba(16, 24, 48, .14); font-family: IRANSans-FaNum, sans-serif; color: #1f2329; overflow-wrap: anywhere; }
  .flagv .err-dlg .hd { display: flex; padding-top: 14px; }
  .flagv .err-dlg .flag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 16px 4px 14px; border: 1px solid rgba(229, 56, 59, .22); border-right: 0; border-radius: 12px 0 0 12px; background: #fff1f1; } /* flag: square on the wall, icon on the message's 16px edge */
  .flagv .err-dlg .flag svg { flex: none; color: #e5383b; }
  .flagv .err-dlg .flag b { font-size: 13px; font-weight: 500; line-height: 1.6; color: #b42318; }
  .flagv .err-dlg p { margin: 0; padding: 10px 16px 12px; border-bottom: 1px solid #ededed; font-size: 14px; line-height: 1.9; color: #1f2329; text-wrap: pretty; }
  .flagv .err-dlg .r { color: #e5383b; font-weight: 500; }
  .flagv .err-dlg .g { color: #00953c; font-weight: 500; }
  .flagv .err-dlg .ok { display: block; min-width: 76px; height: 30px; margin: 10px auto 10px 16px; padding: 0 18px; border: 0; border-radius: 8px; background: #00b74a; color: #fff; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s, transform .1s; }
  .flagv .err-dlg .ok:hover { background: #00a844; }
  .flagv .err-dlg .ok:active { background: #00a142; transform: scale(.97); }
  /* warning variant (<dialog class="err-dlg warn">): same layout, flag and its parts go orange */
  .flagv .err-dlg.warn .flag { border-color: rgba(245, 158, 11, .35); background: #fff7e6; }
  .flagv .err-dlg.warn .flag svg { color: #f59e0b; }
  .flagv .err-dlg.warn .flag b { color: #b45309; }
  .flagv .err-dlg .ok:focus-visible { outline: 2px solid #00b74a; outline-offset: 2px; }
  .flagv .err-dlg { width: 100%; max-width: none; }
  /* v12: same card, full-width tinted header tile instead of the flag */
  .v12 .err-dlg { box-sizing: border-box; width: 100%; padding: 0; border: 1px solid #e3e6ea; border-radius: 14px; outline: 4px solid rgba(255, 255, 255, .2); background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 48, .05), 0 12px 32px rgba(16, 24, 48, .14); font-family: IRANSans-FaNum, sans-serif; color: #1f2329; overflow: hidden; overflow-wrap: anywhere; }
  .v12 .err-dlg .hd { display: flex; align-items: center; gap: 6px; margin: 6px; padding: 8px 10px; border: 1px solid #fbe6e6; border-radius: 8px; background: #fff5f5; }
  .v12 .err-dlg .hd svg { flex: none; color: #e5383b; }
  .v12 .err-dlg .hd b { flex: 1; font-size: 14px; font-weight: 500; color: #b42318; }
  .v12 .err-dlg p { margin: 0; padding: 8px 16px 12px; border-bottom: 1px solid #ededed; font-size: 14px; line-height: 1.9; color: #1f2329; }
  .v12 .err-dlg .r { color: #e5383b; font-weight: 500; }
  .v12 .err-dlg .g { color: #00953c; font-weight: 500; }
  .v12 .err-dlg .ok { display: block; min-width: 76px; height: 30px; margin: 10px auto 10px 12px; padding: 0 18px; border: 0; border-radius: 8px; background: #00b74a; color: #fff; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .v12 .err-dlg.warn .hd { border-color: #fde3b0; background: #fff7e6; }
  .v12 .err-dlg.warn .hd svg { color: #f59e0b; }
  .v12 .err-dlg.warn .hd b { color: #b45309; }
</style></head><body>
<div class="grid">
<div class="opt flagv"><h2>فلگ — خطا</h2><div class="err-dlg" role="alertdialog" aria-labelledby="t1" aria-describedby="d1"><div class="hd"><span class="flag"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 6.8v6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.3" fill="#fff"/></svg><b id="t1">خطا</b></span></div><p id="d1">لطفاً موارد با <span class="r">حاشیه قرمز</span> را <span class="g">تکمیل یا اصلاح</span> کنید.</p><button type="button" class="ok">تایید</button></div></div>
<div class="opt v12"><h2>نسخه‌ی ۱۲ — خطا</h2><div class="err-dlg" role="alertdialog" aria-labelledby="t2" aria-describedby="d2"><div class="hd"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 6.8v6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.3" fill="#fff"/></svg><b id="t2">خطا</b></div><p id="d2">لطفاً موارد با <span class="r">حاشیه قرمز</span> را <span class="g">تکمیل یا اصلاح</span> کنید.</p><button type="button" class="ok">تایید</button></div></div>
<div class="opt flagv"><h2>فلگ — هشدار</h2><div class="err-dlg warn" role="alertdialog" aria-labelledby="t3" aria-describedby="d3"><div class="hd"><span class="flag"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 6.8v6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.3" fill="#fff"/></svg><b id="t3">هشدار</b></span></div><p id="d3">لطفاً موارد با <span class="r">حاشیه قرمز</span> را <span class="g">تکمیل یا اصلاح</span> کنید.</p><button type="button" class="ok">تایید</button></div></div>
<div class="opt v12"><h2>نسخه‌ی ۱۲ — هشدار</h2><div class="err-dlg warn" role="alertdialog" aria-labelledby="t4" aria-describedby="d4"><div class="hd"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 6.8v6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.3" fill="#fff"/></svg><b id="t4">هشدار</b></div><p id="d4">لطفاً موارد با <span class="r">حاشیه قرمز</span> را <span class="g">تکمیل یا اصلاح</span> کنید.</p><button type="button" class="ok">تایید</button></div></div>
</div>
</body></html>
